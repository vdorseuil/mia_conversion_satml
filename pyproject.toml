[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selection-bias"
version = "0.1.0"
description = "Code of the paper 'Reliable Estimation of Differential Privacy under Selection Bias'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dp-accounting>=0.6.0",
    "kymatio>=0.3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
]

[tool.setuptools.packages.find]
where = ["src"]
